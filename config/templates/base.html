{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>SkillSync AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            transition: all 0.3s ease;
        }

        /* LIGHT MODE */
        body.light {
            background-color: #f8f9fa;
            color: #212529;
        }

        /* DARK MODE */
        body.dark {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        /* NAVBAR */
        .navbar {
            padding: 15px 50px;
        }

        body.dark .navbar {
            background-color: #020617;
        }

        /* CARDS */
        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        body.dark .card {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        /* 🔥 CARD HOVER EFFECT (IMPROVED) */
        .card-custom {
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card-custom:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* DARK MODE SHADOW */
        body.dark .card-custom:hover {
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* INPUTS */
        body.dark input,
        body.dark select {
            background-color: #020617;
            color: white;
            border: 1px solid #334155;
        }

        /* BUTTON FIX FOR DARK MODE */
        body.dark .btn-outline-dark {
            color: #e2e8f0;
            border-color: #e2e8f0;
        }

        body.dark .btn-outline-dark:hover {
            background-color: #e2e8f0;
            color: #000;
        }

        .search-box {
            border-radius: 60px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;  /* 🔥 KEY FIX */
            align-items: center;
            gap: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: white;
            max-width: 900px;
            margin: auto;  /* 🔥 CENTER */
        }

        .search-box div {
            flex: 1;
        }

        .search-box small {
            font-size: 12px;
            color: gray;
        }

        .search-box p {
            margin: 0;
            font-weight: 500;
        }

        /* DARK MODE */
        body.dark .search-box {
            background: #1e293b;
        }

        /* 🔥 INTERACTIVE SEARCH BOX */
        .search-item {
            flex: 1;
            padding: 10px 15px;
            border-radius: 12px;
            transition: 0.3s;
            cursor: pointer;
        }

        .search-item:hover {
            background: rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }

        body.dark .search-item:hover {
            background: rgba(255,255,255,0.08);
        }

        /* 🔥 BUTTON */
        .search-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #111827;
            color: white;
            font-size: 20px;
            transition: 0.3s;
        }

        .search-btn:hover {
            transform: scale(1.1);
        }

        /* DARK MODE BUTTON */
        body.dark .search-btn {
            background: #e2e8f0;
            color: #000;
        }

        /* MODAL DARK MODE */
        body.dark .modal-content {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        body.dark .modal-header {
            border-bottom: 1px solid #334155;
        }

        body.dark .modal-footer {
            border-top: 1px solid #334155;
        }
    </style>
</head>

<body id="body">

<!-- 🔝 NAVBAR -->
<nav class="navbar d-flex justify-content-between">

    <!-- LOGO -->
    <h4 class="d-flex align-items-center">
        <a href="/" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
            <img src="{% static 'images/logo.png' %}" 
                 style="height: 50px; margin-right: 10px; border-radius: 8px;">
            <b>SkillSync AI</b>
        </a>
    </h4>

    <div>
        <!-- 🌙 THEME TOGGLE -->
        <button onclick="toggleTheme()" class="btn btn-outline-secondary me-2" id="theme-btn">
            🌙
        </button>

        {% if user.is_authenticated %}

            {% if request.path == '/resume/upload/' %}
                <a href="/" class="btn btn-primary">Home</a>
            {% else %}
                <a href="/resume/upload/" class="btn btn-success">Dashboard</a>
            {% endif %}

            <!-- LOGOUT BUTTON -->
            <button onclick="confirmLogout()" class="btn btn-danger">
                Logout
            </button>

        {% else %}
            <a href="/login/" class="btn btn-outline-dark">Login</a>
            <a href="/signup/" class="btn btn-warning">Sign Up</a>
        {% endif %}
    </div>

</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- 🌙 THEME SCRIPT -->
<script>
function toggleTheme() {
    let body = document.getElementById("body");
    let btn = document.getElementById("theme-btn");

    if (body.classList.contains("dark")) {
        body.classList.replace("dark", "light");
        localStorage.setItem("theme", "light");
        btn.innerHTML = "🌙";
    } else {
        body.classList.replace("light", "dark");
        localStorage.setItem("theme", "dark");
        btn.innerHTML = "☀️";
    }
}

window.onload = function () {
    let theme = localStorage.getItem("theme");
    let body = document.getElementById("body");
    let btn = document.getElementById("theme-btn");

    if (theme === "dark") {
        body.classList.add("dark");
        btn.innerHTML = "☀️";
    } else {
        body.classList.add("light");
        btn.innerHTML = "🌙";
    }
};
</script>


<script>
    const isAuthenticated = {{ user.is_authenticated|yesno:"true,false" }};
</script>

<script>
function goToDashboard() {

    if (!isAuthenticated) {

        Swal.fire({
            title: "🔒 Login Required",
            text: "You must be logged in to continue!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#2563eb",
            cancelButtonColor: "#6b7280",
            confirmButtonText: "Login",
            cancelButtonText: "Cancel"
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "/login/?next=/resume/upload/";
            }
        });

    } else {
        window.location.href = "/resume/upload/";
    }

}
</script>

<script>
function confirmLogout() {

    Swal.fire({
        title: "🚪 Logout?",
        text: "Are you sure you want to logout?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#ef4444",
        cancelButtonColor: "#6b7280",
        confirmButtonText: "Yes, Logout",
        cancelButtonText: "Cancel"
    }).then((result) => {

        if (result.isConfirmed) {
            document.getElementById("logout-form").submit();
        }

    });
}
</script>

<script>
function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
}
</script>

<script>
{% if messages %}
    {% for message in messages %}
        Swal.fire({
            title: "🎉 Notification",
            text: "{{ message }}",
            icon: "success",
            confirmButtonColor: "#10b981"
        });
    {% endfor %}
{% endif %}
</script>


<!-- ✅ BOOTSTRAP JS (CORRECT POSITION) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<form id="logout-form" method="POST" action="/logout/" style="display:none;">
    {% csrf_token %}
</form>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    {% if messages %}
        {% for message in messages %}
            Swal.fire({
                title: "🎉 Success",
                text: "{{ message }}",
                icon: "{{ message.tags }}",
                confirmButtonColor: "#10b981"
            });
        {% endfor %}
    {% endif %}

});
</script>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - SkillSync AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #667eea, #764ba2, #0f172a, #1e293b);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .logo {
            width: 80px;
            margin-bottom: 10px;
        }

        input {
            border-radius: 10px !important;
            padding: 10px;
        }

        .btn {
            border-radius: 10px;
            font-weight: 500;
        }

        a {
            color: #ffd369;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #ff6b6b;
            list-style: none;
            padding: 0;
            font-size: 14px;
        }

        label {
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="card col-md-4 text-center">

    <!-- LOGO -->
    <img src="{% static 'images/logo.png' %}" class="logo mx-auto">

    <h3><b>SkillSync AI</b></h3>
    <p class="mb-4">Create your account</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <!-- USERNAME -->
        <div class="mb-3 text-start">
            <label>Username</label>
            <input type="text" name="username" class="form-control"
                   title="Username should be unique (4–20 characters, no spaces)"
                   required>
            {{ form.username.errors }}
        </div>

        <!-- PASSWORD -->
        <div class="mb-3 text-start">
            <label>Password</label>
            <input type="password" name="password1" class="form-control"
                   title="Password must be at least 8 characters, include letters and numbers"
                   required>
            {{ form.password1.errors }}
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="mb-3 text-start">
            <label>Password Confirmation</label>
            <input type="password" name="password2" class="form-control"
                   title="Re-enter the same password"
                   required>
            {{ form.password2.errors }}
        </div>

        <button class="btn btn-success w-100">🚀 Register</button>
    </form>

    <p class="mt-3">
        Already have an account? 
        <a href="/login/">Login</a>
    </p>

</div>

</body>
</html>
